name: ECR and EKS Deploy

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region
        type: string
        default: us-east-2
      ecr_repository:
        description: ECR repository name (e.g. lab/subnet-calculator)
        type: string
        required: true
      cluster_name:
        description: EKS cluster name
        type: string
        default: lab-eks-cluster
      helm_chart:
        description: Path to the Helm chart
        type: string
        default: helm
      namespace:
        description: Kubernetes namespace
        type: string
        default: lab
      release_name:
        description: Helm release name
        type: string
        required: true
      node_version:
        description: Node.js version used only if a local build is needed
        type: string
        default: "22"
    secrets:
      AWS_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    name: Push to ECR and Helm deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${{ inputs.cluster_name }}"

      - name: Helm upgrade
        env:
          IMAGE_REPO: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository }}
        run: |
          helm upgrade --install "${{ inputs.release_name }}" "${{ inputs.helm_chart }}" \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${GITHUB_SHA}" \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 10m

      - name: Show Service
        run: |
          kubectl -n "${{ inputs.namespace }}" get svc "${{ inputs.release_name }}"
          kubectl -n "${{ inputs.namespace }}" get ingress 2>/dev/null || true
